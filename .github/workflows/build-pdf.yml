name: Build PDF report

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/**'
      - 'scripts/build-pdf.mjs'
      - 'scripts/sync-data.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # Mirror canonical /data CSVs into /docs/data so the runtime fetches
      # see them. Doing this in CI removes the "did you remember to run
      # sync-data.sh?" failure mode that bit us when CSV edits silently
      # diverged from the served copy.
      - name: Sync data CSVs into docs/data
        run: bash scripts/sync-data.sh

      - name: Build PDF
        run: npm run build:pdf

      - name: Commit updated PDF and synced data
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # If nothing changed, exit cleanly.
          if git diff --quiet -- docs/seattle-dog-parks-report.pdf docs/index.html docs/data; then
            echo "No change to PDF, index link, or synced data."
            exit 0
          fi

          # Save the freshly-built artifacts to a tmpdir outside the repo
          # so we can replay them on top of whatever main looks like at
          # push time. The cache-bust ?v= stamp in index.html and the
          # binary PDF can't auto-merge during rebase, so we use "rebuild
          # outputs always win" semantics: discard upstream's copy of any
          # artifact, write our just-built copy in its place.
          ART=$(mktemp -d)
          mkdir -p "$ART/docs"
          cp docs/seattle-dog-parks-report.pdf "$ART/docs/"
          cp docs/index.html                   "$ART/docs/"
          cp -r docs/data                      "$ART/docs/"

          # Retry up to 5 times to handle the race where a developer pushes
          # while the Action is committing.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            cp "$ART/docs/seattle-dog-parks-report.pdf" docs/
            cp "$ART/docs/index.html"                   docs/
            rm -rf docs/data
            cp -r "$ART/docs/data"                      docs/

            git add docs/seattle-dog-parks-report.pdf docs/index.html docs/data
            if git diff --cached --quiet; then
              echo "Artifacts already match origin/main — nothing to commit."
              rm -rf "$ART"
              exit 0
            fi
            git commit -m "chore(pdf): regenerate report from latest site [skip ci]"
            if git push; then
              echo "Push succeeded on attempt $i."
              rm -rf "$ART"
              exit 0
            fi
            echo "Push rejected on attempt $i — refetching and retrying."
          done
          echo "Could not push PDF after 5 attempts; giving up cleanly."
          rm -rf "$ART"
          exit 0
